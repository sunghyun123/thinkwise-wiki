<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>씽크와이즈 위키</title>
  <style>
    :root {
      --ink: #16251d;
      --muted: #68766e;
      --line: #dce5df;
      --paper: #ffffff;
      --canvas: #f4f7f4;
      --brand: #176b45;
      --brand-dark: #0e4d31;
      --brand-soft: #e7f4ed;
      --danger: #b42318;
      --shadow: 0 18px 50px rgba(28, 62, 43, 0.09);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background:
        radial-gradient(circle at 10% 0%, rgba(80, 157, 109, 0.12), transparent 28rem),
        var(--canvas);
      font-family: "Pretendard", "Noto Sans KR", "Malgun Gothic", sans-serif;
    }

    .shell {
      width: min(1180px, calc(100% - 32px));
      margin: 0 auto;
      padding: 56px 0 64px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 24px;
      margin-bottom: 26px;
    }

    .eyebrow {
      margin: 0 0 8px;
      color: var(--brand);
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(30px, 5vw, 48px);
      line-height: 1.08;
      letter-spacing: -0.055em;
    }

    .subtitle {
      margin: 12px 0 0;
      color: var(--muted);
      font-size: 16px;
      line-height: 1.65;
    }

    .local-badge {
      flex: none;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 9px 12px;
      border: 1px solid #b8d8c6;
      border-radius: 999px;
      color: var(--brand-dark);
      background: var(--brand-soft);
      font-size: 13px;
      font-weight: 700;
    }

    .local-badge::before {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #2f9e64;
      content: "";
    }

    .search-panel {
      padding: 22px;
      border: 1px solid var(--line);
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.92);
      box-shadow: var(--shadow);
    }

    form {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 112px 116px;
      gap: 10px;
    }

    input, select, button {
      min-height: 50px;
      border-radius: 12px;
      font: inherit;
    }

    input, select {
      width: 100%;
      border: 1px solid #cbd8d0;
      color: var(--ink);
      background: var(--paper);
      outline: none;
    }

    input {
      padding: 0 17px;
      font-size: 16px;
    }

    select { padding: 0 12px; }

    input:focus, select:focus {
      border-color: var(--brand);
      box-shadow: 0 0 0 3px rgba(23, 107, 69, 0.13);
    }

    button {
      border: 0;
      color: white;
      background: var(--brand);
      font-weight: 800;
      cursor: pointer;
      transition: background 150ms ease, transform 150ms ease;
    }

    button:hover { background: var(--brand-dark); }
    button:active { transform: translateY(1px); }
    button:disabled { opacity: 0.65; cursor: wait; }

    .search-note {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      margin-top: 12px;
      color: var(--muted);
      font-size: 13px;
    }

    .error {
      min-height: 20px;
      margin: 10px 0 0;
      color: var(--danger);
      font-size: 14px;
      font-weight: 700;
    }

    .results-panel {
      margin-top: 22px;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 20px;
      background: var(--paper);
      box-shadow: 0 10px 30px rgba(28, 62, 43, 0.05);
    }

    .results-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      min-height: 62px;
      padding: 0 20px;
      border-bottom: 1px solid var(--line);
    }

    .results-head h2 { margin: 0; font-size: 17px; }
    .summary { color: var(--muted); font-size: 13px; }

    .table-wrap { overflow-x: auto; }

    table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
    }

    th, td {
      padding: 14px 16px;
      border-bottom: 1px solid #e8eee9;
      text-align: left;
      vertical-align: top;
      font-size: 14px;
      line-height: 1.5;
    }

    th {
      color: #536159;
      background: #f8faf8;
      font-size: 12px;
      letter-spacing: 0.02em;
    }

    tbody tr:last-child td { border-bottom: 0; }
    tbody tr:hover td { background: #fbfdfb; }

    .time { width: 166px; white-space: nowrap; }
    .author { width: 94px; }
    .action { width: 80px; }
    .collaboration { width: 150px; }
    .detail { overflow-wrap: anywhere; }

    .action-pill {
      display: inline-block;
      min-width: 46px;
      padding: 4px 8px;
      border-radius: 7px;
      color: var(--brand-dark);
      background: var(--brand-soft);
      text-align: center;
      font-size: 12px;
      font-weight: 800;
    }

    .empty {
      padding: 72px 24px;
      color: var(--muted);
      text-align: center;
      line-height: 1.7;
    }

    [hidden] { display: none !important; }

    @media (max-width: 720px) {
      .shell { width: min(100% - 20px, 1180px); padding-top: 30px; }
      header { display: block; }
      .local-badge { margin-top: 18px; }
      .search-panel { padding: 14px; border-radius: 16px; }
      form { grid-template-columns: 1fr 104px; }
      input { grid-column: 1 / -1; }
      .search-note { display: block; line-height: 1.65; }
      .results-panel { border-radius: 16px; }
      .results-head { align-items: flex-start; flex-direction: column; padding: 15px; }

      table, tbody, tr, td { display: block; width: 100%; }
      thead { display: none; }
      tr { padding: 14px 16px; border-bottom: 1px solid var(--line); }
      tbody tr:last-child { border-bottom: 0; }
      td {
        display: grid;
        grid-template-columns: 74px 1fr;
        gap: 10px;
        padding: 5px 0;
        border: 0;
      }
      td::before {
        color: var(--muted);
        content: attr(data-label);
        font-size: 12px;
        font-weight: 700;
      }
      tbody tr:hover td { background: transparent; }
      .time, .author, .action, .collaboration { width: auto; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header>
      <div>
        <p class="eyebrow">ThinkWise Search</p>
        <h1>씽크와이즈 위키</h1>
        <p class="subtitle">작업 이력에 남은 가지 내용을 빠르게 찾아봅니다.</p>
      </div>
      <span class="local-badge">내 PC 전용 MVP</span>
    </header>

    <section class="search-panel" aria-labelledby="search-title">
      <h2 id="search-title" hidden>검색</h2>
      <form id="search-form" novalidate>
        <input
          id="query"
          name="q"
          type="search"
          minlength="2"
          maxlength="100"
          autocomplete="off"
          placeholder="찾을 단어를 2글자 이상 입력하세요"
          aria-label="검색어"
          required
          autofocus
        >
        <select id="limit" name="limit" aria-label="표시할 결과 수">
          <option value="20">20개</option>
          <option value="50" selected>50개</option>
          <option value="100">100개</option>
        </select>
        <button id="search-button" type="submit">검색</button>
      </form>
      <div class="search-note">
        <span>내용에 검색어가 포함된 이력을 최신순으로 표시합니다.</span>
        <span>조회 전용 · 운영 DB 변경 없음</span>
      </div>
      <p id="error" class="error" role="alert" aria-live="polite"></p>
    </section>

    <section class="results-panel" aria-labelledby="results-title">
      <div class="results-head">
        <h2 id="results-title">검색 결과</h2>
        <span id="summary" class="summary" aria-live="polite">검색어를 입력해 주세요.</span>
      </div>
      <div id="empty" class="empty">두 글자 이상의 단어로 씽크와이즈 작업 이력을 검색해 보세요.</div>
      <div id="table-wrap" class="table-wrap" hidden>
        <table>
          <thead>
            <tr>
              <th class="time" scope="col">시각</th>
              <th class="author" scope="col">작성자</th>
              <th class="action" scope="col">구분</th>
              <th scope="col">내용</th>
              <th class="collaboration" scope="col">협업명</th>
            </tr>
          </thead>
          <tbody id="results-body"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script>
    const form = document.querySelector("#search-form");
    const queryInput = document.querySelector("#query");
    const limitSelect = document.querySelector("#limit");
    const button = document.querySelector("#search-button");
    const errorBox = document.querySelector("#error");
    const summary = document.querySelector("#summary");
    const empty = document.querySelector("#empty");
    const tableWrap = document.querySelector("#table-wrap");
    const resultsBody = document.querySelector("#results-body");
    let activeRequest = null;

    function makeCell(label, value, className = "") {
      const cell = document.createElement("td");
      cell.dataset.label = label;
      cell.className = className;
      cell.textContent = value || "-";
      return cell;
    }

    function renderResults(data) {
      resultsBody.replaceChildren();
      const fragment = document.createDocumentFragment();

      for (const item of data.results) {
        const row = document.createElement("tr");
        row.append(makeCell("시각", item.event_time, "time"));
        row.append(makeCell("작성자", item.author, "author"));

        const actionCell = document.createElement("td");
        actionCell.dataset.label = "구분";
        actionCell.className = "action";
        const pill = document.createElement("span");
        pill.className = "action-pill";
        pill.textContent = item.action_type || "-";
        actionCell.append(pill);
        row.append(actionCell);

        row.append(makeCell("내용", item.detail, "detail"));
        row.append(makeCell("협업명", item.collaboration, "collaboration"));
        fragment.append(row);
      }

      resultsBody.append(fragment);
      const suffix = data.has_more ? ` · 상위 ${data.limit}개만 표시` : "";
      summary.textContent = `“${data.query}” ${data.count}건${suffix}`;
      empty.hidden = data.results.length > 0;
      tableWrap.hidden = data.results.length === 0;
      if (data.results.length === 0) {
        empty.textContent = "일치하는 작업 이력이 없습니다.";
      }
    }

    function readErrorMessage(payload) {
      if (typeof payload?.detail === "string") return payload.detail;
      return "검색 중 문제가 발생했습니다. 잠시 후 다시 시도해 주세요.";
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const query = queryInput.value.trim();
      errorBox.textContent = "";

      if (query.length < 2) {
        errorBox.textContent = "검색어를 2글자 이상 입력해 주세요.";
        queryInput.focus();
        return;
      }

      activeRequest?.abort();
      activeRequest = new AbortController();
      button.disabled = true;
      button.textContent = "검색 중…";
      summary.textContent = "데이터베이스를 조회하고 있습니다.";

      try {
        const params = new URLSearchParams({ q: query, limit: limitSelect.value });
        const response = await fetch(`/api/search?${params}`, {
          signal: activeRequest.signal,
          headers: { Accept: "application/json" }
        });
        const payload = await response.json();
        if (!response.ok) throw new Error(readErrorMessage(payload));
        renderResults(payload);
      } catch (error) {
        if (error.name !== "AbortError") {
          errorBox.textContent = error.message;
          summary.textContent = "검색하지 못했습니다.";
        }
      } finally {
        button.disabled = false;
        button.textContent = "검색";
      }
    });
  </script>
</body>
</html>
