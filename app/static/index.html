<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>씽크와이즈 위키</title>
  <style>
    :root {
      --ink: #16251d;
      --muted: #68766e;
      --line: #dce5df;
      --paper: #ffffff;
      --canvas: #f4f7f4;
      --brand: #176b45;
      --brand-dark: #0e4d31;
      --brand-soft: #e7f4ed;
      --danger: #b42318;
      --warn: #8a5a00;
      --warn-soft: #fdf3e2;
      --shadow: 0 18px 50px rgba(28, 62, 43, 0.09);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background:
        radial-gradient(circle at 10% 0%, rgba(80, 157, 109, 0.12), transparent 28rem),
        var(--canvas);
      font-family: "Pretendard", "Noto Sans KR", "Malgun Gothic", sans-serif;
    }

    .shell { width: min(1180px, calc(100% - 32px)); margin: 0 auto; padding: 56px 0 64px; }

    header {
      display: flex; justify-content: space-between; align-items: flex-start;
      gap: 24px; margin-bottom: 26px;
    }

    .eyebrow {
      margin: 0 0 8px; color: var(--brand); font-size: 13px; font-weight: 800;
      letter-spacing: 0.1em; text-transform: uppercase;
    }

    h1 { margin: 0; font-size: clamp(30px, 5vw, 48px); line-height: 1.08; letter-spacing: -0.055em; }
    .subtitle { margin: 12px 0 0; color: var(--muted); font-size: 16px; line-height: 1.65; }

    .sync-badge {
      flex: none; display: inline-flex; align-items: center; gap: 8px;
      padding: 9px 12px; border: 1px solid #b8d8c6; border-radius: 999px;
      color: var(--brand-dark); background: var(--brand-soft);
      font-size: 13px; font-weight: 700;
    }
    .sync-badge::before {
      width: 8px; height: 8px; border-radius: 50%; background: #2f9e64; content: "";
    }
    .sync-badge.stale {
      border-color: #e9d3a6; color: var(--warn); background: var(--warn-soft);
    }
    .sync-badge.stale::before { background: #d99a1c; }

    .search-panel {
      padding: 22px; border: 1px solid var(--line); border-radius: 20px;
      background: rgba(255, 255, 255, 0.92); box-shadow: var(--shadow);
    }

    form { display: grid; grid-template-columns: minmax(0, 1fr) 112px 116px; gap: 10px; }

    input, select, button { min-height: 50px; border-radius: 12px; font: inherit; }
    input, select {
      width: 100%; border: 1px solid #cbd8d0; color: var(--ink);
      background: var(--paper); outline: none;
    }
    input { padding: 0 17px; font-size: 16px; }
    select { padding: 0 12px; }
    input:focus, select:focus {
      border-color: var(--brand); box-shadow: 0 0 0 3px rgba(23, 107, 69, 0.13);
    }

    button {
      border: 0; color: white; background: var(--brand); font-weight: 800;
      cursor: pointer; transition: background 150ms ease, transform 150ms ease;
    }
    button:hover { background: var(--brand-dark); }
    button:active { transform: translateY(1px); }
    button:disabled { opacity: 0.65; cursor: wait; }

    .filters {
      display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)) auto;
      gap: 10px; margin-top: 12px; padding-top: 14px; border-top: 1px dashed var(--line);
    }
    .filters select { min-height: 42px; font-size: 14px; }
    .filters .reset {
      min-height: 42px; padding: 0 14px; color: var(--brand-dark);
      background: var(--brand-soft); font-size: 13px; font-weight: 700;
    }
    .filters .reset:hover { background: #d6ebe0; }

    .search-note {
      display: flex; justify-content: space-between; gap: 16px;
      margin-top: 12px; color: var(--muted); font-size: 13px;
    }

    .error { min-height: 20px; margin: 10px 0 0; color: var(--danger); font-size: 14px; font-weight: 700; }

    .results-panel {
      margin-top: 22px; overflow: hidden; border: 1px solid var(--line);
      border-radius: 20px; background: var(--paper); box-shadow: 0 10px 30px rgba(28, 62, 43, 0.05);
    }

    .results-head {
      display: flex; justify-content: space-between; align-items: center;
      gap: 16px; min-height: 62px; padding: 0 20px; border-bottom: 1px solid var(--line);
    }
    .results-head h2 { margin: 0; font-size: 17px; }
    .summary { color: var(--muted); font-size: 13px; }
    .summary strong { color: var(--ink); }

    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; table-layout: fixed; }

    th, td {
      padding: 13px 16px; border-bottom: 1px solid #e8eee9;
      text-align: left; vertical-align: top; font-size: 14px; line-height: 1.5;
    }
    th { color: #536159; background: #f8faf8; font-size: 12px; letter-spacing: 0.02em; }
    tbody tr:last-child td { border-bottom: 0; }
    tbody tr.branch:hover td { background: #fbfdfb; }

    .time { width: 150px; white-space: nowrap; }
    .author { width: 96px; }
    .map { width: 140px; }
    .expand-col { width: 92px; }
    .detail { overflow-wrap: anywhere; }

    .detail-text { font-weight: 600; }
    .history {
      margin-top: 5px; color: var(--muted); font-size: 12.5px;
      display: flex; flex-wrap: wrap; gap: 6px 10px;
    }

    .badge {
      display: inline-block; padding: 2px 7px; border-radius: 6px;
      font-size: 11.5px; font-weight: 800;
    }
    .badge.deleted { color: var(--danger); background: #fdeceb; }
    .badge.kind { color: var(--brand-dark); background: var(--brand-soft); }

    .expand-btn {
      min-height: 32px; padding: 0 11px; border-radius: 8px;
      color: var(--brand-dark); background: var(--brand-soft);
      font-size: 12.5px; font-weight: 700;
      white-space: nowrap;   /* 좁은 칸에서 "펼/치/기"로 쪼개지는 것을 막는다 */
    }
    .expand-btn:hover { background: #d6ebe0; }

    tr.events td { padding: 0 16px 14px; background: #fbfdfb; }
    .events-box { border-left: 3px solid var(--brand-soft); padding: 4px 0 4px 14px; }
    .event-line {
      display: grid; grid-template-columns: 160px 92px 1fr; gap: 10px;
      padding: 4px 0; color: #445; font-size: 13px; border-bottom: 1px solid #eef3ef;
    }
    .event-line:last-child { border-bottom: 0; }
    .event-line .kind { font-weight: 700; }
    .event-line .note { color: var(--muted); font-size: 12px; }
    .events-cap {
      margin: 2px 0 8px; padding: 6px 10px; border-radius: 8px;
      color: var(--warn); background: var(--warn-soft); font-size: 12.5px; font-weight: 700;
    }

    .empty { padding: 72px 24px; color: var(--muted); text-align: center; line-height: 1.7; }
    .notice {
      margin: 0; padding: 11px 20px; border-bottom: 1px solid var(--line);
      color: var(--warn); background: var(--warn-soft); font-size: 13px; font-weight: 700;
    }

    [hidden] { display: none !important; }

    @media (max-width: 780px) {
      .shell { width: min(100% - 20px, 1180px); padding-top: 30px; }
      header { display: block; }
      .sync-badge { margin-top: 18px; }
      .search-panel { padding: 14px; border-radius: 16px; }
      form { grid-template-columns: 1fr 104px; }
      input { grid-column: 1 / -1; }
      .filters { grid-template-columns: 1fr 1fr; }
      .search-note { display: block; line-height: 1.65; }
      .results-panel { border-radius: 16px; }
      .results-head { align-items: flex-start; flex-direction: column; padding: 15px; }

      table, tbody, tr, td { display: block; width: 100%; }
      thead { display: none; }
      tr.branch { padding: 14px 16px; border-bottom: 1px solid var(--line); }
      tr.branch td {
        display: grid; grid-template-columns: 74px 1fr; gap: 10px; padding: 5px 0; border: 0;
      }
      tr.branch td::before {
        color: var(--muted); content: attr(data-label); font-size: 12px; font-weight: 700;
      }
      tbody tr.branch:hover td { background: transparent; }
      .time, .author, .map, .expand-col { width: auto; }
      .event-line { grid-template-columns: 1fr; gap: 2px; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header>
      <div>
        <p class="eyebrow">ThinkWise Search</p>
        <h1>씽크와이즈 위키</h1>
        <p class="subtitle">작업 이력에 남은 가지 내용을 찾아봅니다. 같은 가지의 반복 기록은 한 줄로 묶여 있습니다.</p>
      </div>
      <span id="sync-badge" class="sync-badge">색인 확인 중…</span>
    </header>

    <section class="search-panel" aria-labelledby="search-title">
      <h2 id="search-title" hidden>검색</h2>
      <form id="search-form" novalidate>
        <input id="query" name="q" type="search" minlength="2" maxlength="100"
               autocomplete="off" placeholder="찾을 단어를 2글자 이상 입력하세요"
               aria-label="검색어" required autofocus>
        <select id="limit" name="limit" aria-label="표시할 결과 수">
          <option value="50">50개</option>
          <option value="100" selected>100개</option>
          <option value="200">200개</option>
          <option value="500">500개</option>
        </select>
        <button id="search-button" type="submit">검색</button>
      </form>

      <div class="filters" id="filters" hidden>
        <select id="filter-year" aria-label="연도로 좁히기"></select>
        <select id="filter-map" aria-label="맵으로 좁히기"></select>
        <select id="filter-author" aria-label="작성자로 좁히기"></select>
        <button type="button" class="reset" id="filter-reset">필터 해제</button>
      </div>

      <div class="search-note">
        <span>내용에 검색어가 포함된 가지를 마지막 수정 순으로 보여줍니다.</span>
        <span>조회 전용 · 운영 DB 변경 없음</span>
      </div>
      <p id="error" class="error" role="alert" aria-live="polite"></p>
    </section>

    <section class="results-panel" aria-labelledby="results-title">
      <div class="results-head">
        <h2 id="results-title">검색 결과</h2>
        <span id="summary" class="summary" aria-live="polite">검색어를 입력해 주세요.</span>
      </div>
      <p id="notice" class="notice" hidden></p>
      <div id="empty" class="empty">두 글자 이상의 단어로 씽크와이즈 작업 이력을 검색해 보세요.</div>
      <div id="table-wrap" class="table-wrap" hidden>
        <table>
          <thead>
            <tr>
              <th class="time" scope="col">마지막 수정</th>
              <th class="author" scope="col">수정한 사람</th>
              <th scope="col">내용</th>
              <th class="map" scope="col">맵</th>
              <th class="expand-col" scope="col">기록</th>
            </tr>
          </thead>
          <tbody id="results-body"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script>
    const form = document.querySelector("#search-form");
    const queryInput = document.querySelector("#query");
    const limitSelect = document.querySelector("#limit");
    const button = document.querySelector("#search-button");
    const errorBox = document.querySelector("#error");
    const summary = document.querySelector("#summary");
    const notice = document.querySelector("#notice");
    const empty = document.querySelector("#empty");
    const tableWrap = document.querySelector("#table-wrap");
    const resultsBody = document.querySelector("#results-body");
    const syncBadge = document.querySelector("#sync-badge");
    const filtersBox = document.querySelector("#filters");
    const filterEls = {
      year: document.querySelector("#filter-year"),
      map: document.querySelector("#filter-map"),
      author: document.querySelector("#filter-author"),
    };
    const FILTER_LABEL = { year: "전체 연도", map: "전체 맵", author: "전체 작성자" };

    let activeRequest = null;
    let lastQuery = "";

    const nf = new Intl.NumberFormat("ko-KR");

    function shortTime(value) {
      return (value || "").slice(0, 16);
    }

    /* 색인이 얼마나 낡았는지 항상 보여준다. 동기화가 죽어도 검색은 계속 되기 때문에,
       알려주지 않으면 낡은 결과를 최신인 줄 알고 보게 된다. */
    function renderSync(sync) {
      if (!sync) return;
      const age = sync.age_minutes;
      const stale = sync.error || age === null || age > 30;
      syncBadge.classList.toggle("stale", Boolean(stale));
      if (sync.error) {
        syncBadge.textContent = "색인 갱신 실패 — 결과가 낡았을 수 있습니다";
      } else if (age === null) {
        syncBadge.textContent = "색인 갱신 시각 알 수 없음";
      } else if (age < 1) {
        syncBadge.textContent = "방금 갱신됨";
      } else if (age < 60) {
        syncBadge.textContent = `${age}분 전 갱신`;
      } else {
        syncBadge.textContent = `${Math.floor(age / 60)}시간 전 갱신`;
      }
      syncBadge.title = `색인 ${nf.format(sync.row_count)}행 · 마지막 갱신 ${sync.last_sync_at || "-"}`;
    }

    /* 선택지는 지금 걸린 필터가 아니라 검색어 전체에서 만든다(서버가 그렇게 내려준다).
       안 그러면 2021년을 고른 순간 목록에 2021만 남아 연도를 바꿀 수 없다. */
    function renderFacets(facets) {
      for (const kind of ["year", "map", "author"]) {
        const el = filterEls[kind];
        const current = el.value;
        const items = facets?.[kind] ?? [];
        el.replaceChildren();

        const all = document.createElement("option");
        all.value = "";
        all.textContent = FILTER_LABEL[kind];
        el.append(all);

        for (const item of items) {
          const option = document.createElement("option");
          option.value = item.key;
          option.textContent = `${item.key || "(없음)"} (${nf.format(item.count)})`;
          el.append(option);
        }
        // 고른 값이 목록에 없어도 유지한다. 안 그러면 필터가 저 혼자 풀린다.
        if (current && !items.some((item) => item.key === current)) {
          const kept = document.createElement("option");
          kept.value = current;
          kept.textContent = `${current || "(없음)"} (0)`;
          el.append(kept);
        }
        el.value = current;
      }
      filtersBox.hidden = false;
    }

    function makeCell(label, value, className = "") {
      const cell = document.createElement("td");
      cell.dataset.label = label;
      cell.className = className;
      cell.textContent = value || "-";
      return cell;
    }

    function buildDetailCell(item) {
      const cell = document.createElement("td");
      cell.dataset.label = "내용";
      cell.className = "detail";

      const text = document.createElement("div");
      text.className = "detail-text";
      text.textContent = item.detail || "(내용 없음)";
      cell.append(text);

      const history = document.createElement("div");
      history.className = "history";

      if (item.is_deleted) {
        const badge = document.createElement("span");
        badge.className = "badge deleted";
        badge.textContent = "삭제됨";
        history.append(badge);
      }

      const span = document.createElement("span");
      span.textContent = item.event_count > 1
        ? `${nf.format(item.event_count)}개 기록 · ${shortTime(item.first_at)}부터`
        : `기록 1개 · ${shortTime(item.first_at)}`;
      history.append(span);

      for (const kind of item.kinds.filter(Boolean)) {
        const badge = document.createElement("span");
        badge.className = "badge kind";
        badge.textContent = kind;
        history.append(badge);
      }

      cell.append(history);
      return cell;
    }

    async function toggleEvents(item, branchRow, expandButton) {
      const next = branchRow.nextElementSibling;
      if (next && next.classList.contains("events")) {
        next.remove();
        expandButton.textContent = "펼치기";
        return;
      }

      expandButton.disabled = true;
      expandButton.textContent = "여는 중…";
      try {
        const response = await fetch(`/api/branch/${item.branch_id}`, {
          headers: { Accept: "application/json" },
        });
        const payload = await response.json();
        if (!response.ok) throw new Error(payload?.detail || "기록을 불러오지 못했습니다.");

        const row = document.createElement("tr");
        row.className = "events";
        const cell = document.createElement("td");
        cell.colSpan = 5;
        const box = document.createElement("div");
        box.className = "events-box";

        // 펼치기에도 상한이 있다. 잘렸으면 잘렸다고 먼저 말한다.
        if (payload.has_more) {
          const cap = document.createElement("div");
          cap.className = "events-cap";
          cap.textContent =
            `전체 ${nf.format(payload.total)}개 기록 중 최근 ${nf.format(payload.count)}개만 표시합니다.`;
          box.append(cap);
        }

        for (const event of payload.events) {
          const line = document.createElement("div");
          line.className = "event-line";
          const time = document.createElement("span");
          time.textContent = shortTime(event.event_time);
          const kind = document.createElement("span");
          kind.className = "kind";
          kind.textContent = event.action_type;
          const who = document.createElement("span");
          who.textContent = event.author || "(이름 없음)";
          if (event.move_pair) {
            const note = document.createElement("span");
            note.className = "note";
            note.textContent = " — 가지를 옮기며 남은 기록(삭제 아님)";
            who.append(note);
          }
          line.append(time, kind, who);
          box.append(line);
        }

        cell.append(box);
        row.append(cell);
        branchRow.after(row);
        expandButton.textContent = "접기";
      } catch (error) {
        errorBox.textContent = error.message;
        expandButton.textContent = "펼치기";
      } finally {
        expandButton.disabled = false;
      }
    }

    function renderResults(data) {
      resultsBody.replaceChildren();
      const fragment = document.createDocumentFragment();

      for (const item of data.results) {
        const row = document.createElement("tr");
        row.className = "branch";
        row.append(makeCell("마지막 수정", shortTime(item.last_at), "time"));
        row.append(makeCell("수정한 사람", item.last_author, "author"));
        row.append(buildDetailCell(item));
        row.append(makeCell("맵", item.collaboration, "map"));

        const expandCell = document.createElement("td");
        expandCell.dataset.label = "기록";
        expandCell.className = "expand-col";
        const expandButton = document.createElement("button");
        expandButton.type = "button";
        expandButton.className = "expand-btn";
        expandButton.textContent = "펼치기";
        expandButton.addEventListener("click", () => toggleEvents(item, row, expandButton));
        expandCell.append(expandButton);
        row.append(expandCell);

        fragment.append(row);
      }

      resultsBody.append(fragment);
      renderFacets(data.facets);
      renderSync(data.sync);

      summary.innerHTML = `“${data.query}” 전체 <strong>${nf.format(data.total)}</strong>개 가지 중 ${nf.format(data.count)}개 표시`;

      /* 잘렸으면 잘렸다고 말한다. 숫자만 조용히 모자라면 사용자는 이게 전부인 줄 안다. */
      if (data.has_more) {
        notice.hidden = false;
        notice.textContent =
          `${nf.format(data.total - data.count)}개가 표시되지 않았습니다. 표시 개수를 늘리거나 연도·맵·작성자로 좁혀 보세요.`;
      } else {
        notice.hidden = true;
      }

      empty.hidden = data.results.length > 0;
      tableWrap.hidden = data.results.length === 0;
      if (data.results.length === 0) {
        empty.textContent = "조건에 맞는 가지가 없습니다. 필터를 풀거나 다른 단어로 찾아보세요.";
      }
    }

    function readErrorMessage(payload) {
      if (typeof payload?.detail === "string") return payload.detail;
      return "검색 중 문제가 발생했습니다. 잠시 후 다시 시도해 주세요.";
    }

    async function runSearch() {
      const query = queryInput.value.trim();
      errorBox.textContent = "";

      if (query.length < 2) {
        errorBox.textContent = "검색어를 2글자 이상 입력해 주세요.";
        queryInput.focus();
        return;
      }

      // 검색어가 바뀌면 이전 검색어에 걸어둔 필터는 의미가 없다.
      if (query !== lastQuery) {
        for (const el of Object.values(filterEls)) el.value = "";
      }
      lastQuery = query;

      activeRequest?.abort();
      activeRequest = new AbortController();
      button.disabled = true;
      button.textContent = "검색 중…";
      summary.textContent = "찾고 있습니다…";

      try {
        const params = new URLSearchParams({ q: query, limit: limitSelect.value });
        for (const [kind, el] of Object.entries(filterEls)) {
          if (el.value) params.set(kind, el.value);
        }
        const response = await fetch(`/api/search?${params}`, {
          signal: activeRequest.signal,
          headers: { Accept: "application/json" },
        });
        const payload = await response.json();
        if (!response.ok) throw new Error(readErrorMessage(payload));
        renderResults(payload);
      } catch (error) {
        if (error.name !== "AbortError") {
          errorBox.textContent = error.message;
          summary.textContent = "검색하지 못했습니다.";
        }
      } finally {
        button.disabled = false;
        button.textContent = "검색";
      }
    }

    form.addEventListener("submit", (event) => {
      event.preventDefault();
      runSearch();
    });

    limitSelect.addEventListener("change", () => { if (lastQuery) runSearch(); });
    for (const el of Object.values(filterEls)) {
      el.addEventListener("change", () => { if (lastQuery) runSearch(); });
    }
    document.querySelector("#filter-reset").addEventListener("click", () => {
      for (const el of Object.values(filterEls)) el.value = "";
      if (lastQuery) runSearch();
    });

    fetch("/api/status", { headers: { Accept: "application/json" } })
      .then((response) => (response.ok ? response.json() : null))
      .then(renderSync)
      .catch(() => { syncBadge.textContent = "색인 상태 확인 실패"; syncBadge.classList.add("stale"); });
  </script>
</body>
</html>
